# nonk8s
# ClassIsland 插件清单。
#
# apiVersion 的含义是"本插件只能在**不低于**该版本的 ClassIsland 上工作"。
# 这里写 2.1.0.1，与 csproj 里 ClassIslandPluginSdkVersion 的默认值一致 ——
# 两者必须同步，否则会出现"清单说能用、实际一调 API 就炸"的错配。
# 针对 2.1.1.1 单独出的那一份由 scripts/package.ps1 改写这里再打包。
id: classshout.bridge
name: ClassShout 联动
description: 把 ClassShout 教室端的喊话显示为 ClassIsland 提醒，让喊话出现在学生已经在看的那块屏上。
entranceAssembly: "ClassShout.ClassIslandPlugin.dll"
url: https://github.com/WRD1145/ClassShoutCiPlugin
version: 1.0.1.0
apiVersion: 2.1.0.1
author: WRD1145
